function App(){const[phase,setPhase]=useState('home'),[player,setPlayer]=useState('LUI'),[mode,setMode]=useState('standard'),[current,setCurrent]=useState(null),[picked,setPicked]=useState(null),[standardUsed,setStandardUsed]=useState([]),[intimateUsed,setIntimateUsed]=useState([]);const choices=mode==='standard'?STANDARD_CHOICES:INTIMATE_CHOICES;const used=mode==='standard'?standardUsed:intimateUsed;const open=(i)=>{const pair=choices[i];const opts=Math.random()<.5?[pair.good,pair.bad]:[pair.bad,pair.good];setCurrent({i,opts});setPicked(null);setPhase('choice')};const choose=(n)=>{if(picked!==null)return;setPicked(n);if(mode==='standard')setStandardUsed(x=>x.includes(current.i)?x:[...x,current.i]);else setIntimateUsed(x=>x.includes(current.i)?x:[...x,current.i])};const next=()=>{setPhase('game');setPlayer(p=>p==='LUI'?'ELLE':'LUI')};useEffect(()=>{if(mode==='standard'&&standardUsed.length===50){setMode('intimate');setPlayer('LUI')}} ,[standardUsed]);useEffect(()=>{if(mode==='intimate'&&intimateUsed.length===50)setPhase('done')},[intimateUsed]);if(phase==='home')return <main style={{minHeight:'100vh',display:'grid',placeItems:'center',background:'radial-gradient(circle at 50% 35%,#3a1118,#120508 65%)',color:'#fff',textAlign:'center',fontFamily:'Arial'}}><div><div style={{letterSpacing:'.45em',fontSize:11,color:'#d9a38f'}}>EXPÉRIENCE PREMIUM</div><h1 style={{font:'italic 64px Georgia',margin:'20px 0',color:'#f1c0ae'}}>Alors, 1 ou 2 ?</h1><p style={{color:'#b99c96'}}>50 jours de hasard.<br/>Êtes-vous prêts à assumer ?</p><button onClick={()=>setPhase('game')} style={{marginTop:28,padding:'17px 38px',borderRadius:30,border:'1px solid #8d5149',background:'#34161b',color:'#eab6aa',letterSpacing:'.18em'}}>OUVRIR L’ANTICHAMBRE</button></div></main>;if(phase==='game')return <main style={{minHeight:'100vh',padding:30,background:'radial-gradient(circle at 50% 0%,#321018,#100507 70%)',color:'#fff',fontFamily:'Arial'}}><div style={{maxWidth:1050,margin:'auto',textAlign:'center'}}><div style={{letterSpacing:'.35em',fontSize:10,color:'#d99f91'}}>MODE {mode==='standard'?'QUOTIDIEN':'INTIME'} · {used.length}/50</div><h2 style={{font:'italic 48px Georgia',color:'#efb9ad'}}>Tour de {player}</h2><div style={{display:'grid',gridTemplateColumns:'repeat(8,1fr)',gap:10}}>{choices.map((_,i)=><button key={i} disabled={used.includes(i)} onClick={()=>open(i)} style={{aspectRatio:'.72',border:'1px solid #75434a',background:used.includes(i)?'#3a3334':'rgba(255,255,255,.06)',color:used.includes(i)?'#777':'#d8aaa2',font:'22px Georgia',borderRadius:6}}>{String(i+1).padStart(2,'0')}</button>)}</div></div></main>;if(phase==='choice'&&current)return <main style={{minHeight:'100vh',display:'grid',placeItems:'center',padding:20,background:'rgba(18,5,8,.98)',color:'#fff',fontFamily:'Arial'}}><div style={{width:'min(760px,100%)',textAlign:'center'}}><div style={{fontSize:10,letterSpacing:'.3em',color:'#d9a38f'}}>CARTE {String(current.i+1).padStart(2,'0')} · {mode==='standard'?'QUOTIDIEN':'INTIME'}</div><h2 style={{font:'italic 46px Georgia',color:'#efb9ad'}}>Tour de {player}</h2><div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>{current.opts.map((t,n)=><button key={n} disabled={picked!==null} onClick={()=>choose(n)} style={{minHeight:190,padding:24,textAlign:'left',background:picked===null?'#241014':picked===n?'#4a1b20':'#171113',border:'1px solid '+(picked===n?'#d9a38f':'#5b3439'),color:'#fff',borderRadius:8}}><small style={{color:'#d9a38f'}}>OPTION {n+1}</small><strong style={{display:'block',marginTop:25,fontSize:17,lineHeight:1.5,fontWeight:400}}>{t}</strong></button>)}</div>{picked!==null&&<button onClick={next} style={{marginTop:20,padding:'15px 35px',background:'#6b302e',border:'1px solid #b16f64',color:'#fff',letterSpacing:'.2em'}}>CONTINUER</button>}</div></main>;return <main style={{minHeight:'100vh',display:'grid',placeItems:'center',background:'#120508',color:'#fff',fontFamily:'Arial',textAlign:'center'}}><div><div style={{letterSpacing
