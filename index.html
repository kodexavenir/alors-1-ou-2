<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><title>ALORS ? 1 OU 2 ?</title><script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/react@18/umd/react.production.min.js"></script><script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script><style>body{background:#120508;margin:0;overflow-x:hidden}</style></head><body><div id="root"></div><script type="text/babel">const{useState}=React;const STANDARD_CHOICES=[{good:"Massage sensuel du dos (20 min)",bad:"Nettoyage intégral de la cuisine"},{good:"Contrôle absolu du programme TV",bad:"Corvée de nettoyage des salles de bain"},{good:"Service du petit-déjeuner au lit",bad:"Gestion exclusive des déchets de la semaine"},{good:"Veto inconditionnel sur une décision",bad:"Massage des pieds obligatoire (15 min)"},{good:"Grasse matinée sans interruption",bad:"Réveil anticipé pour préparer le café"},{good:"Dîner favori préparé par l'autre",bad:"Repas de secours (pâtes au beurre)"},{good:"Soirée de repos absolu sur le canapé",bad:"Rangement complet de la pièce à vivre"},{good:"Joker 'Je passe mon tour'",bad:"Gestion immédiate de la paperasse en retard"},{good:"Prochain resto offert par l'autre",bad:"Financement des prochaines courses"},{good:"Soirée déconnectée (Zéro écran)",bad:"Confiscation du téléphone pendant 2 heures"},{good:"Contrôle de l'ambiance musicale (24h)",bad:"Pliage et rangement du linge propre"},{good:"Droit à un caprice culinaire",bad:"Préparation du lit au carré chaque matin"},{good:"Soirée surprise organisée par l'autre",bad:"Nettoyage complet du véhicule"},{good:"Bain chaud préparé par l'autre",bad:"Aspiration intégrale du logement"},{good:"Massage crânien (15 min)",bad:"Nettoyage des vitres du salon"},{good:"Choix de la prochaine sortie",bad:"Nettoyer l'intérieur du frigo"},{good:"Une heure de tranquillité absolue",bad:"Faire les poussières partout"},{good:"L'autre te prépare ton dessert préféré",bad:"Manger les restes d'hier"},{good:"Tu gagnes un 'Oui' automatique",bad:"Tu dois dire 'Oui' à la prochaine demande"},{good:"Soirée jeux vidéo / passion sans reproche",bad:"Trier les placards de la chambre"},{good:"Apéro servi sur un plateau",bad:"Descendre toutes les poubelles"},{good:"L'autre fait la vaisselle à ta place",bad:"Faire la vaisselle des deux prochains jours"},{good:"Massage des épaules (10 min)",bad:"Repasser 5 vêtements de l'autre"},{good:"Choix du film ce soir",bad:"L'autre choisit le film ce soir"},{good:"Livraison de repas de ton choix",bad:"Cuisiner un repas équilibré pour demain"},{good:"Câlins à volonté sur demande",bad:"Passer la serpillière"},{good:"Droit d'annuler une sortie prévue",bad:"Organiser la prochaine sortie de A à Z"},{good:"Petit cadeau surprise demain",bad:"Acheter des fleurs/chocolats pour l'autre"},{good:"L'autre porte ta tenue préférée",bad:"Porter la tenue que l'autre choisit"},{good:"Soirée pop-corn et plaid",bad:"Nettoyer le micro-ondes et le four"},{good:"Tu es le roi/la reine pendant 1h",bad:"Tu es le serviteur/la servante pendant 1h"},{good:"Droit de changer de musique en voiture",bad:"Interdiction de toucher à l'autoradio"},{good:"Un compliment par heure aujourd'hui",bad:"Faire un compliment par heure à l'autre"},{good:"L'autre te prépare ton bain",bad:"Nettoyer la douche/baignoire à fond"},{good:"Dégustation de ta boisson favorite",bad:"Boire un grand verre d'eau"},{good:"L'autre te fait la lecture au lit",bad:"Lire un article ennuyeux à voix haute"},{good:"Soirée discussion profonde",bad:"Écouter l'autre parler de sa passion (15 min)"},{good:"L'autre te brosse/coiffe les cheveux",bad:"Faire la manucure de l'autre"},{good:"Droit de voler une frite/part de l'autre",bad:"Céder ta meilleure part au repas"},{good:"L'autre va chercher le courrier",bad:"Gérer tous les appels administratifs"},{good:"Soirée nostalgie >Tour de {player}</h2><div style={{display:'grid',gridTemplateColumns:'repeat(8,1fr)',gap:10}}>{STANDARD_CHOICES.map((_,i)=><button key={i} onClick={()=>{setCard(i);setPhase('choice')}} style={{aspectRatio:'.72',border:'1px solid #75434a',background:'#241014',color:'#d8aaa2',font:'22px Georgia'}}>{String(i+1).padStart(2,'0')}</button>)}</div></div>{card!==null&&<div style={{position:'fixed',inset:0,display:'grid',placeItems:'center',background:'rgba(12,3,5,.94)',padding:20}}><div style={{width:'min(760px,100%)',textAlign:'center'}}><h2 style={{font:'italic 46px Georgia',color:'#efb9ad'}}>Tour de {player}</h2><div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>{[STANDARD_CHOICES[card].good,STANDARD_CHOICES[card].bad].sort(()=>Math.random()-.5).map((t,n)=><button key={n} onClick={()=>{setCard(null);setCount(x=>Math.min(50,x+1));setPlayer(x=>x==='LUI'?'ELLE':'LUI')}} style={{minHeight:190,padding:24,textAlign:'left',background:'#241014',border:'1px solid #75434a',color:'#fff'}}><small>OPTION {n+1}</small><strong style={{display:'block',marginTop:25,fontSize:17,lineHeight:1.5}}>{t}</strong></button>)}</div></div></div>}</main>;return <main style={{minHeight:'100vh',display:'grid',placeItems:'center',background:'#120508',color:'#fff',textAlign:'center'}}><h1>Expérience terminée</h1></main>}ReactDOM.createRoot(document.getElementById('root')).render(<App/>);</script></body></html>
