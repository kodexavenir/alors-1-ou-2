<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#0b0709"><title>ALORS ? 1 OU 2 ?</title><style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;1,400&display=swap');*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#0b0709;color:#fff;font-family:Inter,sans-serif;overflow:hidden}.app{min-height:100svh;background:radial-gradient(circle at 50% 30%,#e5989b18,transparent 35%),radial-gradient(circle at 80% 80%,#d4af3710,transparent 30%),#0b0709}.shell{min-height:100svh;max-width:1100px;margin:auto;padding:18px;display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:10px;letter-spacing:.35em;display:flex;gap:10px;align-items:center}.mark{width:30px;height:30px;border:1px solid #fff2;display:grid;place-items:center;font:14px Georgia}.mode,.foot{font-size:8px;letter-spacing:.25em;color:#fff6;text-transform:uppercase}.main{flex:1;display:flex;align-items:center;justify-content:center}.view{width:100%;animation:in .45s ease}.center{text-align:center}.eyebrow,.count{font-size:9px;letter-spacing:.4em;color:#e9a1a5a8;text-transform:uppercase;margin-bottom:18px}.title{font:italic clamp(50px,9vw,100px)/.95 'Playfair Display';margin:0 0 25px;background:linear-gradient(90deg,#f1c9cb,#d9bd69);-webkit-background-clip:text;color:transparent}.sub{font-size:12px;line-height:1.9;letter-spacing:.1em;color:#fff8}.btn{border:1px solid #e9a1a54d;background:#e9a1a512;color:#e9a1a5;border-radius:999px;padding:15px 27px;font:500 10px Inter;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;transition:.25s}.btn:active{transform:scale(.97)}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:40px}.secondary{color:#fff8;border-color:#fff2;background:#fff1}.reset{border:0;background:none;color:#fff4;font:9px Inter;letter-spacing:.2em;text-transform:uppercase;margin-top:20px;cursor:pointer}.head{text-align:center;margin-bottom:24px}.head h2{font:italic 400 48px 'Playfair Display';margin:0}.gridwrap{max-height:70svh;overflow:auto;padding:2px}.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:9px;max-width:920px;margin:auto}.card{aspect-ratio:3/4;border:1px solid #e9a1a523;border-radius:12px;background:linear-gradient(145deg,#2e1c2255,#120b0eb8);color:#f5e7e9aa;font:18px Georgia;cursor:pointer;transition:.25s}.card:active{transform:scale(.96)}.card.picked{opacity:.28;filter:grayscale(1);cursor:not-allowed}.card small{font:500 8px Inter;letter-spacing:.2em;text-transform:uppercase}.panes{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:900px;margin:auto}.pane{min-height:290px;border:1px solid #e9a1a523;border-radius:20px;background:#23141a8c;color:#fff;padding:30px;display:grid;place-items:center;text-align:center;cursor:pointer;backdrop-filter:blur(20px);transition:.3s}.pane:active{transform:scale(.98)}.pane h3{font:italic 40px Georgia;color:#e9a1a5aa;margin:0 0 14px}.pane label{display:block;font-size:9px;letter-spacing:.25em;text-transform:uppercase;color:#e9a1a57d;margin-bottom:14px}.pane p{font:400 22px/1.45 'Playfair Display';margin:0}.chosen{border-color:#d9bd69!important;background:#d4af3722}.rejected{opacity:.2;filter:grayscale(1)}.under{text-align:center;min-height:55px;margin-top:20px}.back{position:fixed;left:16px;bottom:16px;border:1px solid #fff2;background:#0b0709ee;color:#fffc;border-radius:999px;padding:10px 14px;font:9px Inter;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;z-index:5}.foot{text-align:center;padding-top:10px}@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1}}@media(max-width:700px){.shell{padding:16px 12px 20px}.grid{grid-template-columns:repeat(4,1fr);gap:7px}.gridwrap{max-height:69svh}.panes{grid-template-columns:1fr}.pane{min-height:205px;padding:22px}.back{left:10px;bottom:10px}.mode{display:none}.foot{font-size:7px}}@media(min-width:701px) and (max-width:999px){.grid{grid-template-columns:repeat(6,1fr)}}</style></head><body><div class="app"><div class="shell"><header class="top"><div class="brand"><span class="mark">K</span>KODEX</div><div class="mode" id="mode"></div></header><main class="main" id="root"></main><footer class="foot">ALORS ? 1 OU 2 ? • 100 CARTES • 2 CHAPITRES</footer></div></div><script>(function(){'use strict';const standard=[['Massage du dos 20 min','Nettoyer la cuisine'],['Petit-déjeuner au lit','Ranger la salle de bain'],['Choisir le film','L’autre choisit le film'],['Choisir la musique','Gérer la playlist'],['Grasse matinée','Réveil anticipé'],['Dîner préféré','Cuisiner demain'],['Soirée plaid','Ranger le salon'],['Joker','Corvée bonus'],['Sortie au choix','Organiser la sortie'],['Soirée zéro écran','Téléphone 2 h'],['Caprice culinaire','Préparer le repas'],['Bain chaud','Nettoyer la douche'],['Massage de la tête','Faire les vitres'],['Une heure de tranquillité','Faire les poussières'],['Dessert préféré','Manger les restes'],['Un oui automatique','Dire oui demain'],['Passion sans reproche','Trier un placard'],['Apéro servi','Descendre les poubelles'],['Vaisselle faite','Vaisselle 2 jours'],['Massage des épaules','Repasser 5 vêtements'],['Playlist au choix','L’autre choisit'],['Repas livré','Cuisiner demain'],['Câlins à volonté','Passer la serpillière'],['Annuler une sortie','Organiser la prochaine'],['Petite surprise','Préparer une attention'],['Tenue préférée','Tenue choisie par l’autre'],['Soirée pop-corn','Nettoyer le four'],['Roi/reine 1 h','Être aux petits soins'],['Musique en voiture','Laisser gérer la musique'],['Compliment par heure','Faire les compliments'],['Boisson favorite','Préparer une boisson'],['Lecture au lit','Lire à voix haute'],['Discussion profonde','Écouter 15 min'],['Coiffure faite','Mise en beauté'],['Voler une frite','Céder la meilleure part'],['Courrier géré','Gérer les appels'],['Soirée souvenirs','Trier les photos'],['Chanson pour toi','Chanter'],['Massage des mains','Nettoyer le sol'],['Choisir le parfum','L’autre choisit le parfum'],['Côté du lit','Prendre le petit côté'],['Boisson surprise','Préparer une surprise'],['Place canapé','Laisser choisir'],['Lit fait 3 jours','Changer les draps'],['Soirée pyjama','S’habiller chic'],['Massage complet','Une heure de rangement'],['Sortie surprise','Organiser demain'],['Attention spéciale','Préparer une attention'],['Moment à deux','Planifier demain'],['Repos absolu','Rangement complet']];const intimate=[['Douche à deux lumière douce','Préparer le spa'],['Massage aux huiles','Massage des pieds'],['Danse lente privée','Danse romantique'],['Choisir l’ambiance','L’autre choisit'],['Long baiser romantique','Pas de baiser 1 h'],['Partager un désir','Question intime'],['Jeu de rôle romantique','L’autre choisit le scénario'],['Soirée cocooning','Préparer la chambre'],['Danse rapprochée','Chorégraphie'],['Mots doux','Écrire 3 compliments'],['Caresses des mains','Rester immobile 5 min'],['Choisir la tenue','L’autre choisit ta tenue'],['Bain moussant','Préparer les bougies'],['Action ou vérité romantique','Question gênante'],['Baisers sur le visage','Massage du visage'],['Massage 20 min','Offrir 20 min'],['Question intime','Trois questions'],['Playlist romantique','Choisir 5 chansons'],['Massage duo','Préparer les accessoires'],['Jeu chaud/froid douceur','Choisir le programme'],['Choisir le rythme','L’autre choisit le rythme'],['Photo élégante','Photo de couple'],['Baisers dans le cou','Massage du cuir chevelu'],['Lieu romantique','Sortie surprise'],['Défi séduction','Rejouer la première rencontre'],['Jeu des sens','Guider avec la voix'],['Mot secret','Inventer un mot'],['Soirée bien-être','Soirée pour l’autre'],['Premier rendez-vous','Petite surprise'],['Choisir les lumières','L’autre choisit les lumières'],['Massage parfumé','Choisir une senteur'],['Dessert partagé','Préparer un dessert'],['Baisers dans le dos','Massage du dos'],['Règles du jeu','L’autre choisit les règles'],['Deviner un mot','Faire deviner un mot'],['Réveil romantique','Petit-déjeuner demain'],['Massage sommeil','Massage jusqu’au sommeil'],['Choisir doux ou énergique','L’autre choisit le rythme'],['Lettre romantique','Écrire une lettre'],['Partager un secret','Révéler une envie'],['Regard intense','Tenir le regard 3 min'],['Jeu de confiance','Bandeau de confiance'],['Défi chatouilles','Une minute de chatouilles'],['Lumière tamisée','Danser une chanson'],['Choisir un baiser','L’autre choisit le baiser'],['Massage surprise','Massage surprise'],['Slow romantique','Danse rapprochée'],['Dire ce que tu veux','Choisir une attention'],['Promesse pour demain','Planifier demain'],['Moment rien qu’à deux','Moment à deux']];const KEY='alors_fixed_v3';let state=load();const root=document.getElementById('root'),mode=document.getElementById('mode');function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function makeDeck(pairs){return shuffle(pairs).map((x,i)=>({id:i,a:x[0],b:x[1],picked:false}))}function fresh(ch){return{chapter:ch,day:0,phase:'home',cards:makeDeck(ch?intimate:standard),pick:null,result:null}}function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.cards)&&x.cards.length===50)return x}catch(e){}return fresh(0)}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function setPhase(p){state.phase=p;save();render()}function goHome(){state.phase='home';state.pick=null;state.result=null;save();render()}function startGame(){state.phase='select';save();render()}function pickCard(i){const c=state.cards[i];if(!c||c.picked)return;c.picked=true;state.pick={a:c.a,b:c.b};state.result=null;state.phase='reveal';save();render()}function choose(n){if(state.result)return;state.result=n;save();render()}function next(){state.day++;state.pick=null;state.result=null;if(state.cards.every(c=>c.picked)){if(state.chapter===0){state=fresh(1);state.phase='transition'}else state.phase='complete'}else state.phase='select';save();render()}function unlock(){state.phase='select';save();render()}function reset(){localStorage.removeItem(KEY);state=fresh(0);save();render()}function page(title,eyebrow,text,buttons){return '<section class="view center"><div class="eyebrow">'+eyebrow+'</div><h1 class="title">'+title+'</h1><div class="sub">'+text+'</div><div class="actions">'+buttons+'</div></section>'}function selectView(){const n=state.cards.filter(c=>c.picked).length;return '<section class="view"><div class="head"><div class="count">'+(state.chapter?'Mode intime':'Mode quotidien')+' • '+n+'/50</div><h2>Tour de '+(state.day%2?'ELLE':'LUI')+'</h2></div><div class="gridwrap"><div class="grid">'+state.cards.map((c,i)=>'<button class="card '+(c.picked?'picked':'')+'" data-action="card" data-i="'+i+'">'+(c.picked?'<small>Pris</small>':String(i+1).padStart(2,'0'))+'</button>').join('')+'</div></div></section><button class="back" data-action="home">Accueil</button>'}function revealView(){const r=state.result,p=state.pick;return '<section class="view"><div class="head"><div class="count">Le hasard a parlé</div><h2>Tour de '+(state.day%2?'ELLE':'LUI')+'</h2></div><div class="panes"><button class="pane '+(r===1?'chosen':r===2?'rejected':'')+'" data-action="choose" data-n="1">'+(r?'<div><label>'+(r===1?'Privilège accordé':'Option refusée')+'</label><p>'+p.a+'</p></div>':'<div><h3>I</h3><label>Dilemme inconnu</label></div>')+'</button><button class="pane '+(r===2?'chosen':r===1?'rejected':'')+'" data-action="choose" data-n="2">'+(r?'<div><label>'+(r===2?'Privilège accordé':'Option refusée')+'</label><p>'+p.b+'</p></div>':'<div><h3>II</h3><label>Dilemme inconnu</label></div>')+'</button></div><div class="under">'+(r?'<button class="btn" data-action="next">Accepter & continuer</button>':'')+'</div></section><button class="back" data-action="select">Retour</button>'}function render(){mode.textContent=state.chapter?'CHAPITRE INTIME':'EXPÉRIENCE PRIVÉE';let h;if(state.phase==='home')h=page('Alors, 1 ou 2 ?','Expérience premium','50 jours de hasard.<br>Êtes-vous prêts à assumer?','<button type="button" class="btn" data-action="start">Ouvrir l’antichambre</button><button type="button" class="reset" data-action="reset">Réinitialiser</button>');else if(state.phase==='select')h=selectView();else if(state.phase==='reveal')h=revealView();else if(state.phase==='transition')h=page('Le deuxième chapitre','Niveau 1 terminé','Les 50 premières cartes sont terminées.<br>Une nouvelle série vous attend.','<button class="btn" data-action="unlock">Débloquer le chapitre intime</button><button class="btn secondary" data-action="home">Retour à l’accueil</button>');else h=page('100 cartes.','Expérience terminée','Vous avez terminé les deux chapitres.<br>La progression reste sauvegardée.','<button class="btn" data-action="home">Retour à l’accueil</button><button class="btn secondary" data-action="reset">Recommencer</button>');root.innerHTML=h}let lastTouch=0;function handleAction(e){if(e.type==='click'&&Date.now()-lastTouch<800)return;const b=e.target&&e.target.closest?e.target.closest('[data-action]'):null;if(!b)return;const a=b.dataset.action;if(e.cancelable)e.preventDefault();if(a==='start')startGame();else if(a==='home')goHome();else if(a==='reset')reset();else if(a==='card')pickCard(Number(b.dataset.i));else if(a==='choose')choose(Number(b.dataset.n));else if(a==='next')next();else if(a==='select')setPhase('select');else if(a==='unlock')unlock()}document.addEventListener('click',handleAction,{passive:false});document.addEventListener('touchend',function(e){lastTouch=Date.now();handleAction(e)},{passive:false});save();render()})();</script></body></html>
