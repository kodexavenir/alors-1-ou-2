or:#fff2;background:#fff1}.reset{border:0;background:none;color:#fff4;font:9px Inter;letter-spacing:.2em;text-transform:uppercase;margin-top:20px;cursor:pointer}.head{text-align:center;margin-bottom:24px}.head h2{font:italic 400 48px 'Playfair Display';margin:0}.gridwrap{max-height:68vh;overflow:auto}.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:9px;max-width:920px;margin:auto}.card{aspect-ratio:3/4;border:1px solid #e9a1a523;border-radius:12px;background:linear-gradient(145deg,#2e1c2255,#120b0eb8);color:#f5e7e9aa;font:18px Georgia;cursor:pointer;transition:.3s}.card:hover{transform:translateY(-5px) scale(1.03);border-color:#e9a1a55c}.card.picked{opacity:.3;filter:grayscale(1);cursor:not-allowed}.card small{font:500 8px Inter;letter-spacing:.2em;text-transform:uppercase}.panes{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:900px;margin:auto}.pane{min-height:290px;border:1px solid #e9a1a523;border-radius:20px;background:#23141a8c;color:#fff;padding:30px;display:grid;place-items:center;text-align:center;cursor:pointer;backdrop-filter:blur(20px);transition:.35s}.pane:hover{transform:translateY(-5px);border-color:#e9a1a55c}.pane h3{font:italic 40px Georgia;color:#e9a1a5aa;margin:0 0 14px}.pane label{display:block;font-size:9px;letter-spacing:.25em;text-transform:uppercase;color:#e9a1a57d;margin-bottom:14px}.pane p{font:400 22px/1.45 'Playfair Display';margin:0}.chosen{border-color:#d9bd69!important;background:#d4af3722}.rejected{opacity:.2;filter:grayscale(1);transform:scale(.97)}.under{text-align:center;min-height:55px;margin-top:20px}.back{position:fixed;left:16px;bottom:16px;border:1px solid #fff2;background:#0b0709dd;color:#fffc;border-radius:999px;padding:10px 14px;font:9px Inter;letter-spacing:.18em;text-transform:uppercase;cursor:pointer}.foot{text-align:center;padding-top:12px}@media(max-width:700px){.shell{padding:17px 13px 24px}.grid{grid-template-columns:repeat(4,1fr);gap:7px}.gridwrap{max-height:70svh}.panes{grid-template-columns:1fr}.pane{min-height:205px}.back{left:11px;bottom:11px}.mode{display:none}}@media(min-width:701px) and (max-width:999px){.grid{grid-template-columns:repeat(6,1fr)}}</style></head><body><div class=app><div class=shell><header class=top><div class=brand><span class=mark>K</span>KODEX</div><div class=mode id=mode></div></header><main class=main id=root></main><footer class=foot>ALORS ? 1 OU 2 ? • 100 CARTES • 2 CHAPITRES</footer></div></div><script>

const K='alors_fixed_v2';let s=load();function sh(a){return[...a].sort(()=>Math.random()-.5)}function deck(a,b){return sh(a).map((x,i)=>({id:i,a:x,b:b[i],p:0}))}function load(){try{let x=JSON.parse(localStorage.getItem(K));if(x&&x.cards?.length===50)return x}catch(e){}return{ch:0,day:0,phase:'home',cards:deck(A,B),pick:null,res:null}}function save(){localStorage.setItem(K,JSON.stringify(s))}function reset(){if(confirm('Réinitialiser toute la progression ?')){localStorage.removeItem(K);s={ch:0,day:0,phase:'home',cards:deck(A,B),pick:null,res:null};save();render()}}function home(){s.phase='home';s.pick=s.res=null;save();render()}function start(){s.phase='select';save();render()}function card(id){let c=s.cards[id];if(c.p)return;c.p=1;s.pick={a:c.a,b:c.b};s.phase='reveal';save();render()}function choose(n){if(!s.res)s.res=n;save();render()}function next(){s.day++;s.pick=s.res=null;if(s.cards.every(c=>c.p)){if(!s.ch){s.ch=1;s.day=0;s.cards=deck(C,D);s.phase='transition'}else s.phase='complete'}else s.phase='select';save();render()}function intimate(){s.phase='select';save();render()}function select(){return `<section class=view><div class=head><div class=count>${s.ch?'Mode intime':'Mode quotidien'} • ${s.cards.filter(c=>c.p).length}/50</div><h2>Tour de ${s.day%2?'ELLE':'LUI'}</h2></div><div class=gridwrap><div class=grid>${s.cards.map((c,i)=>`<button class="card ${c.p?'picked':''}" ${c.p?'disabled':''} onclick="card(${i})">${c.p?'<small>Pris</small>':String(i+1).padStart(2,'0')}</button>`).join('')}</div></div></section><button class=back onclick=home>Accueil</button>`}function reveal(){let r=s.res;return `<section class=view><div class=head><div class=count>Le hasard a parlé</div><h2>${s.day%2?'ELLE':'LUI'}</h2></div><div class=panes><button class="pane ${r==1?'chosen':r==2?'rejected':''}" onclick=choose(1)>${r?`<div><label>${r==1?'Privilège accordé':'Option refusée'}</label><p>${s.pick.a}</p></div>`:'<div><h3>I</h3><label>Dilemme inconnu</label></div>'}</button><button class="pane ${r==2?'chosen':r==1?'rejected':''}" onclick=choose(2)>${r?`<div><label>${r==2?'Privilège accordé':'Option refusée'}</label><p>${s.pick.b}</p></div>`:'<div><h3>II</h3><label>Dilemme inconnu</label></div>'}</button></div><div class=under>${r?'<button class=btn onclick=next>Accepter & continuer</button>':''}</div></section><button class=back onclick="s.phase='select';s.pick=s.res=null;save();render()">Retour</button>`}function page(t,e,txt,bs){return `<section class="view center"><div class=eyebrow>${e}</div><h1 class=title>${t}</h1><div class=sub>${txt}</div><div class=actions>${bs}</div></section>`}function render(){mode.textContent=s.ch?'CHAPITRE INTIME':'EXPÉRIENCE PRIVÉE';let h=s.phase==='home'?page('Alors, 1 ou 2 ?','Expérience premium','50 jours de hasard.<br>Êtes-vous prêts à assumer ?',`<button class=btn onclick=start>Ouvrir l’antichambre</button><button class=reset onclick=reset>Réinitialiser</button>`):s.phase==='select'?select():s.phase==='reveal'?reveal():s.phase==='transition'?page('Le deuxième chapitre','Niveau 1 terminé','Les 50 premières cartes sont terminées.<br>Une nouvelle série vous attend.',`<button class=btn onclick=intimate>Débloquer le chapitre intime</button><button class="btn secondary" onclick=home>Retour à l’accueil</button>`):page('100 cartes.','Expérience terminée','Vous avez terminé les deux chapitres.<br>La progression reste sauvegardée.',`<button class=btn onclick=home>Retour à l’accueil</button><button class="btn secondary" onclick=reset>Recommencer</button>`);root.innerHTML=h}render();
</script></body></html>
